syntax = "proto3";

package envoystudy.v1;

service InfoService {
  rpc GetInfo(InfoRequest) returns (InfoResponse);
}

message InfoRequest {}

message MetadataEntry {
  string key = 1;
  string value = 2;
}

message InfoResponse {
  string service_name = 1;
  string version = 2;
  string hostname = 3;
  repeated MetadataEntry metadata = 4;
}
