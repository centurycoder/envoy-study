# This version leverages subset, and achived the goal that /v1 goes to 8081 while /v2 goes to 8082
static_resources:
  listeners:
  - name: lab1_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          # stat_prefix is must
          stat_prefix: ingress_http
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: local_route
            ignore_port_in_host_matching: true
            virtual_hosts:
            - name: local_service
              domains: ["api.lab"]
              routes:
              - match:
                  prefix: "/v1"
                route:
                  cluster: healthy_upstreams
                  prefix_rewrite: "/"
                  metadata_match:
                      filter_metadata:
                        envoy.lb:
                          version: '1.0'
              - match:
                  prefix: "/v2"
                route:
                  cluster: healthy_upstreams
                  prefix_rewrite: "/"
                  metadata_match:
                      filter_metadata:
                        envoy.lb:
                          version: '2.0'
  clusters:
  - name: healthy_upstreams
    type: STRICT_DNS
    connect_timeout: 1s
    lb_subset_config:
      fallback_policy: NO_FALLBACK
      subset_selectors:
      - keys: ["version"]
    
    load_assignment:
      cluster_name: healthy_upstreams
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ubuntu-2604
                port_value: 8081
          load_balancing_weight: 9
          metadata:
            filter_metadata:
              envoy.lb:
                version: '1.0'
          
        - endpoint:
            address:
              socket_address:
                address: ubuntu-2604
                port_value: 8082
          load_balancing_weight: 1
          metadata:
            filter_metadata:
              envoy.lb:
                version: '2.0'

admin:
  address:
    socket_address:
      protocol: TCP
      address: 127.0.0.1
      port_value: 9901