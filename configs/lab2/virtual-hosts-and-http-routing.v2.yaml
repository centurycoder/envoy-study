# This is the fixed version
static_resources:
  listeners:
  - name: lab1_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          # stat_prefix is must
          stat_prefix: ingress_http
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: local_route
            ignore_port_in_host_matching: true
            virtual_hosts:
            - name: local_service
              domains: ["api.lab"]
              routes:
              # Envoy uses the first matching route. Putting this first makes beta requests go directly to canary—including beta requests for /v1.
              - match:
                  prefix: "/"
                  headers:
                  - name: x-user-group
                    string_match:
                      exact: "beta"
                route:
                  cluster: api_canary

              - match:
                  prefix: "/v1"
                route:
                  cluster: api_stable
                  prefix_rewrite: "/"

              - match:
                  prefix: "/v2"
                route:
                  cluster: api_canary
                  prefix_rewrite: "/"

              - name: stable_canary_split
                match:
                  prefix: "/"
                route:
                  weighted_clusters:
                    clusters:
                    - name: api_stable
                      weight: 90
                    - name: api_canary
                      weight: 10


  clusters:
  - name: api_stable
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: api_stable
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ubuntu-2604
                port_value: 8081

  - name: api_canary
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: api_canary
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ubuntu-2604
                port_value: 8082

admin:
  address:
    socket_address:
      protocol: TCP
      address: 127.0.0.1
      port_value: 9901