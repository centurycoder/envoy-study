static_resources:
  listeners:
  - name: lab1_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          # stat_prefix is must
          stat_prefix: ingress_http
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: healthy_upstreams
  clusters:
  - name: healthy_upstreams
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: healthy_upstreams
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ubuntu-2604
                port_value: 8081
        - endpoint:
            address:
              socket_address:
                address: ubuntu-2604
                port_value: 8082

admin:
  address:
    socket_address:
      protocol: TCP
      address: 127.0.0.1
      port_value: 9901